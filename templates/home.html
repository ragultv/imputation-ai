<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imp AI </title>
    <link rel="icon" href="/static/impai1.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        ::-webkit-scrollbar {
            display: none;
            width: 0;
            background: transparent;
        }
        

        body {
            color: #FFFFFF;
            Background: linear-gradient(180deg, #FFFFFF 40%, #5576A8 75%, #050D83 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: scroll; /* Enables scrolling */
            
        }
        .logo {
            position: fixed;
            top:0px;
            left: 0px;
            height: 50px;
            margin-top: 20px;
        }


        
        .logout-btn {
            position: absolute;
            background-color: #007bff;
            border: 2px solid white;
            top: 10px;
            right: 10px;
            color: white;
            margin-top: 17px;
            margin-right: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            position: fixed;
        }

        .logout-btn:hover {
            background-color: #ffffff;
            color: #007bff;
            border: 2px solid #007bff;
        }

        .container {
            max-width: 800px;
            margin-top: 40px;
            padding-top: 40px;
            margin: 75px auto 20px;
            padding: 20px;
            background: #ffffff;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Enables scrolling */
            height: calc(100vh - 60px); /* Full viewport height */
            position: fixed; /* Fix the container position */
            left: 50%; /* Center horizontally */
            transform: translateX(-50%); /* Adjust for centering */
            width: 100%; /* Full width */

            
        }

        .container::-webkit-scrollbar {
            display: none; /* For Chrome, Safari, and Edge */
        }

        
        .header {
            background-color: transparent;
            color: rgb(0, 0, 0);
            padding: 35px;
            text-align: center;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }


        .header h1 {
            margin: 0;
        }



        .chat-area {
            flex-grow: 1;
            height: 600px;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 80px; /* Space for input area */
            position: relative;
            height: calc(100vh - 180px); /* Viewport height minus header and input area */
                    
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 20px;
            max-width: 100%;
            line-height:1.5 ;
            color: #FFFFFF;
            width: fit-content;
            display: flex;
            align-items: flex-start;
            
        }
        .system-message-rectangle {
            position: absolute;
            left: -20px;
            top: 0;
            width: 50px;
            height: 100%;
            background-color: transparent;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            padding-top: 5px;
        }
        .message-logo {
            width: 30px;
            height: 30px;
            margin-top: 1px;
            border-radius: 50%;
            margin-right: 10px;
            
        }
        .system-message {
            background-color: transparent;
            color: #000000;
            margin-right: 50px;
            position: relative;
            padding-left: 20px; /* Space for the rectangle */
        }

        .user-message {
            background-color: #d9d9d9;
            padding: 7px;
            margin-left: auto;
            color: #000000;
            border: 2px solid #000000;
            min-width: 60px;
            text-align: left;
            
        }
        .message-content {
            padding-left: 10px;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background-color: #d9d9d9;
            border: 1px solid transparent;
            border-radius: 8px;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 760px; /* Slightly less than container to account for padding */
            z-index: 10;
        }

        .prompt-input {
            flex-grow: 1;
            margin-top: -40px;
            margin-left: -45px;
            margin-right: -45px;
            padding: 12px;
            border:  transparent;
            border-radius: 20px;
            font-size: 14px;
            background-color: #ffffff;
            color: #000000;
            
        }

        .upload-icon-btn {
            background: none;
            margin-top: 40px;
            bottom: 20px;
            margin-left: -10px;
            margin-bottom: -10px;
            border: none;
            cursor: pointer;
            display: flex;

        }
        .send-icon-btn {
            background: none;
            margin-top: 40px;
            bottom: 20px;
            margin-right: -10px;
            margin-bottom: -10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon-btn img {
            width: 40px;
            height: 40px;
        }

        .upload-icon-btn img:hover {
            opacity: 0.8;
        }
        .send-icon-btn img {
            width: 40px;
            height: 40px;
        }

        .send-icon-btn img:hover {
            opacity: 0.8;
        }
        .download-link {
            color: #2200ff;
            text-decoration: none;
            font-weight: bold;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile view adjustments */
        @media (max-width: 768px) {
            .container {
                height: fit-content;
                position: fixed;
                padding: 10px;
                width: 100%;
                max-width: 100%;
            }
            .input-area {
                padding: 10px;
                flex-direction: row;
                margin-bottom: 35px;
            }

            .prompt-input {
                padding: 12px;
                margin-top: -55px;
                margin-bottom: -15px;
                margin-left: -45px;
                margin-right: -45px;
            }

            .icon-btn img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <img src="/static/impai.png" alt="Imputation AI Logo" class="logo">
    <div class="header">
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="container">

        <div class="chat-area" id="chatArea">
            
        </div>
        <div class="input-area">
            <input type="file" id="file-input" accept=".csv,.xlsx" style="display: none;">
            <button class="upload-icon-btn" id="uploadBtn">
                <img src="/static/fileupload_icon.png" alt="Upload">
            </button>
            <input type="text" class="prompt-input" id="promptInput" placeholder="Enter your imputation instructions..." disabled>
            <button class="send-icon-btn" id="sendBtn" disabled>
                <img src="/static/send_icon.png" alt="Send">
            </button>
        </div>
    </div>
</body>
</html>


    <script>
        let uploadedFileName = '';
        const chatArea = document.getElementById('chatArea');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('uploadBtn');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');


        function addMessage(content, type = 'system') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            
            if (type === 'system') {
                // Create rectangle container
                const rectangle = document.createElement('div');
                rectangle.className = 'system-message-rectangle';
                
                // Create logo image
                const logo = document.createElement('img');
                logo.src = '/static/impai1.png';
                logo.alt = 'AI Logo';
                logo.className = 'message-logo';
                
                // Add logo to rectangle
                rectangle.appendChild(logo);
                
                // Create content container
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                
                if (content.includes('<a')) {
                    contentDiv.innerHTML = content;
                } else {
                    contentDiv.textContent = content;
                }
                
                // Add rectangle and content to message
                messageDiv.appendChild(rectangle);
                messageDiv.appendChild(contentDiv);
            } else {
                // For user messages, keep the original behavior
                if (content.includes('<a')) {
                    messageDiv.innerHTML = content;
                } else {
                    messageDiv.textContent = content;
                }
            }
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function typeMessage(content, type = 'system') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            
            if (type === 'system') {
                // Create rectangle container
                const rectangle = document.createElement('div');
                rectangle.className = 'system-message-rectangle';
                
                // Create logo image
                const logo = document.createElement('img');
                logo.src = '/static/impai1.png';
                logo.alt = 'AI Logo';
                logo.className = 'message-logo';
                
                // Add logo to rectangle
                rectangle.appendChild(logo);
                
                // Create content container
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                
                // Add rectangle and content div to message
                messageDiv.appendChild(rectangle);
                messageDiv.appendChild(contentDiv);
                
                chatArea.appendChild(messageDiv);
                chatArea.scrollTop = chatArea.scrollHeight;

                let index = 0;
                const linkRegex = /<a [^>]+>.*?<\/a>/;
                const linkMatch = content.match(linkRegex);
                const plainText = linkMatch ? content.replace(linkMatch[0], '') : content;
                const linkHtml = linkMatch ? linkMatch[0] : '';

                const typingInterval = setInterval(() => {
                    if (index < plainText.length) {
                        contentDiv.textContent += plainText[index];
                        chatArea.scrollTop = chatArea.scrollHeight;
                        index++;
                    } else if (linkHtml && !contentDiv.innerHTML.includes(linkHtml)) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = linkHtml;
                        const linkElement = tempDiv.firstChild;
                        contentDiv.appendChild(linkElement);
                        chatArea.scrollTop = chatArea.scrollHeight;
                        clearInterval(typingInterval);
                    } else {
                        clearInterval(typingInterval);
                    }
                }, 50);
            } else {
                chatArea.appendChild(messageDiv);
                let index = 0;
                const typingInterval = setInterval(() => {
                    if (index < content.length) {
                        messageDiv.textContent += content[index];
                        chatArea.scrollTop = chatArea.scrollHeight;
                        index++;
                    } else {
                        clearInterval(typingInterval);
                    }
                }, 50);
            }
        }

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                addMessage(`${file.name}`, 'user');
                uploadBtn.disabled = true;
                uploadBtn.classList.add('disabled');
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    uploadedFileName = data.file_name;
                    typeMessage(`File "${data.file_name}" uploaded successfully.Please provide imputation instructions. Available methods: mean, median, mode, minmax, forward fill, backward fill, KNN, MICE, or Bayesian.`);
                    //addMessage('Please provide imputation instructions. Available methods: mean, median, mode, minmax, forward fill, backward fill, KNN, MICE, or Bayesian.');
                    promptInput.disabled = false;
                    sendBtn.disabled = false;
                    promptInput.focus();
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('disabled');
            }
        });

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        sendBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user');
            promptInput.value = '';

            try {
                sendBtn.disabled = true;
                sendBtn.classList.add('disabled');

                const response = await fetch('/impute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        file_name: uploadedFileName,
                        prompt: prompt
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    
                    const downloadLink = `<a href="/download/${data.imputed_file_name}" class="download-link" download>Download imputed file</a>`;
                    typeMessage(data.ai_response + ' ' + downloadLink, 'system');
                    //addMessage(downloadLink);
                } else {
                    throw new Error(data.error || 'Imputation failed. Please try again.');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('disabled');
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/logout', {
                    method: 'POST'
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    throw new Error('Logout failed');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            }
        });

        // Initial chat with AI
        fetch('/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: 'hi'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.response) {
                addMessage(data.response);
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    </script>
</body>
</html>
