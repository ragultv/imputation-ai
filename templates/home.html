<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Imputation Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            color: #FFFFFF;
            background-color: #d6d6d6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #FFFFFF;
        }

        .header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }

        .chat-area {
            height: 550px;
            border: 1px solid #565869;
            border-top: none;
            overflow-y: auto;
            padding: 20px;
;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }

        .system-message {
            background-color: #060606;
            margin-right: auto;
        }

        .user-message {
            background-color: #060606;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background-color: #202123;
            border: 1px solid #565869;
            border-top: none;
            border-radius: 0 0 8px 8px;
        }

        .prompt-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #565869;
            border-radius: 4px;
            font-size: 14px;
            background-color: #40414F;
            color: #FFFFFF;
        }

        .upload-btn, .send-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .upload-btn {
            background-color: #007bff;
            color: white;
        }

        .send-btn {
            background-color: #007bff;
            color: white;
        }

        .upload-btn:hover, .send-btn:hover {
            background-color: #007bff;
        }

        .download-link {
            color: #10a37f;
            text-decoration: none;
            font-weight: bold;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        #file-input {
            display: none;
        }

        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Imp AI</h1>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message system-message">Upload your missing dataset?</div>
        </div>
        <div class="input-area">
            <input type="file" id="file-input" accept=".csv">
            <button class="upload-btn" id="uploadBtn">
                <i class="fas fa-upload"></i> Upload
            </button>
            <input type="text" class="prompt-input" id="promptInput" placeholder="Enter your imputation instructions..." disabled>
            <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <script>

        let uploadedFileName = '';
        const chatArea = document.getElementById('chatArea');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('uploadBtn');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(content, type = 'system') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = content;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                uploadBtn.disabled = true;
                uploadBtn.classList.add('disabled');
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    uploadedFileName = data.file_name;
                    addMessage(`File "${data.file_name}" uploaded successfully.`);
                    addMessage(`Please provide imputation instructions .`);
                    promptInput.disabled = false;
                    sendBtn.disabled = false;
                    promptInput.focus();
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('disabled');
            }
        });

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        sendBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user');
            promptInput.value = '';

            try {
                sendBtn.disabled = true;
                sendBtn.classList.add('disabled');

                const response = await fetch('/impute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        file_name: uploadedFileName,
                        prompt: prompt
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const downloadLink = `<a href="/download/${data.imputed_file_name}" class="download-link" download>Download imputed file</a>`;
                    addMessage(`Imputation successful! `);
                    addMessage(`${downloadLink}`);
                } else {
                    throw new Error(data.error || 'I can not do more analytics now please try again ');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('disabled');
            }
        });

        // Helper function to safely insert HTML content
        function addMessage(content, type = 'system') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            if (content.includes('<a')) {
                messageDiv.innerHTML = content;
            } else {
                messageDiv.textContent = content;
            }
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
    </script>
</body>
</html>
