<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imp AI - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            color: #FFFFFF;
            background-color: #d6d6d6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #FFFFFF;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #0D47A1;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .logout-btn {
            background-color: transparent;
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background-color: white;
            color: #007bff;
        }

        .chat-area {
            flex-grow: 1;
            height: 550px;
            border: 1px solid #565869;
            border-top: none;
            overflow-y: auto;
            padding: 20px;
            background-color: #FFFFFF;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
            color: #FFFFFF;
        }

        .system-message {
            background-color: #d6d6d6;
            color:#000000;
            margin-right: auto;
        }

        .user-message {
            background-color: #007bff;
            margin-left: auto;
            color: #000000;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background-color: #202123;
            border: 1px solid #565869;
            border-top: none;
            border-radius: 0 0 8px 8px;
            position: sticky;
            bottom: 0;
        }

        .prompt-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #565869;
            border-radius: 4px;
            font-size: 14px;
            background-color: #40414F;
            color: #FFFFFF;
        }

        .upload-btn, .send-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .upload-btn {
            background-color: #0D47A1;
            color: white;
        }

        .send-btn {
            background-color: #0D47A1;
            color: white;
        }

        .upload-btn:hover, .send-btn:hover {
            opacity: 0.9;
        }

        .download-link {
            color: #10a37f;
            text-decoration: none;
            font-weight: bold;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        #file-input {
            display: none;
        }

        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile view adjustments */
        @media (max-width: 768px) {
            .input-area {
                padding: 10px;
                flex-direction: row;
            }

            .prompt-input {
                margin-bottom: px;
            }

            .upload-btn, .send-btn {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Imp AI</h1>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message system-message">Welcome to Imp AI! Upload your dataset to begin imputation.</div>
        </div>
        <div class="input-area">
            <input type="file" id="file-input" accept=".csv">
            <button class="upload-btn" id="uploadBtn">
                Upload CSV
            </button>
            <input type="text" class="prompt-input" id="promptInput" placeholder="Enter your imputation instructions..." disabled>
            <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <script>
        let uploadedFileName = '';
        const chatArea = document.getElementById('chatArea');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('uploadBtn');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        function addMessage(content, type = 'system') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            if (content.includes('<a')) {
                messageDiv.innerHTML = content;
            } else {
                messageDiv.textContent = content;
            }
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                uploadBtn.disabled = true;
                uploadBtn.classList.add('disabled');
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    uploadedFileName = data.file_name;
                    addMessage(`File "${data.file_name}" uploaded successfully.`);
                    addMessage('Please provide imputation instructions. Available methods: mean, median, mode, minmax, forward fill, backward fill, KNN, MICE, or Bayesian.');
                    promptInput.disabled = false;
                    sendBtn.disabled = false;
                    promptInput.focus();
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('disabled');
            }
        });

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        sendBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, 'user');
            promptInput.value = '';

            try {
                sendBtn.disabled = true;
                sendBtn.classList.add('disabled');

                const response = await fetch('/impute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        file_name: uploadedFileName,
                        prompt: prompt
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage(data.ai_response);
                    const downloadLink = `<a href="/download/${data.imputed_file_name}" class="download-link" download>Download imputed file</a>`;
                    addMessage(downloadLink);
                } else {
                    throw new Error(data.error || 'Imputation failed. Please try again.');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('disabled');
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/logout', {
                    method: 'POST'
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    throw new Error('Logout failed');
                }
            } catch (error) {
                addMessage(`Error: ${error.message}`);
            }
        });

        // Initial chat with AI
        fetch('/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: 'hi'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.response) {
                addMessage(data.response);
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    </script>
</body>
</html>
