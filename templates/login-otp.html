<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imp AI</title>
    <link rel="icon" href="/static/impai1.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #FFFFFF 40%, #5576A8 75%, #050D83 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .logo {
            position: fixed;
            top: 0px;
            margin-top: 20px;
            left: 0px;
            height: 50px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: fixed;
        }

        h1 {
            
            margin-top: 7rem;
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #000;
        }

        .otp-container {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .otp-input {
            width: 40px;
            height: 40px;
            border: none;
            border-bottom: 2px solid #000;
            background: transparent;
            font-size: 1.5rem;
            text-align: center;
            outline: none;
        }

        .resend-text {
            margin-bottom: 2rem;
            color: #000;
        }

        .resend-link {
            color: #2563eb;
            text-decoration: none;
            cursor: pointer;
        }

        .verify-btn {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 9999px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .verify-btn:hover {
            background-color: #1d4ed8;
        }
        @media (max-width: 768px) {
            body {
                position: fixed;
            }
            .container {
                position: fixed;
                

            }
        }
        
    </style>
</head>
<body>
    <img src="/static/impai.png" alt="Imputation AI Logo" class="logo">
    <div class="container">
        </div>
        <h1>Enter the OTP</h1>
        <form>
            <div class="otp-container">
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
            </div>
            <p class="resend-text">
                if you didn't receive a code.<a href="#" class="resend-link">Resend</a>
            </p>
            <button type="submit" class="verify-btn">Verify</button>
            
        </form>
    </div>
    <script>
        // login-otp.js
        document.addEventListener('DOMContentLoaded', function() {
            const otpForm = document.querySelector('form');
            const urlParams = new URLSearchParams(window.location.search);
            const identifier = urlParams.get('identifier');

            // Handle OTP input
            const otpInputs = document.querySelectorAll('.otp-input');
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
            });

            otpForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const otp = Array.from(otpInputs).map(input => input.value).join('');

                try {
                    const response = await fetch('/verify-otp', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ identifier, otp }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        window.location.href = '/';  // Redirect to home page
                    } else {
                        alert(data.error);
                    }
                } catch (error) {
                    alert('An error occurred. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
